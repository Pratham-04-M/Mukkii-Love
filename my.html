<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Future Wife💜💋😋🧿</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #09000f, #3b063d, #17001f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .name {
            font-size: 25px;
            opacity: 0;
            animation: showName 2s ease forwards;
        }

        .heart {
            font-size: 100px;
            margin: 20px;
            animation: heartbeat 1s infinite;
            filter: drop-shadow(0 0 20px #ff4d88);
        }

        .love {
            font-size: 42px;
            font-weight: bold;
            opacity: 0;
            animation: loveAppear 2s ease 2s forwards;
            text-shadow: 0 0 15px #ff4d88;
        }

        .message {
            margin-top: 18px;
            font-size: 18px;
            opacity: 0;
            animation: messageAppear 2s ease 4s forwards;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        @keyframes showName {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loveAppear {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="name">
            For You, My Future Wifeyy Mukkii💋💜
        </div>

        <div class="heart">
            💜
        </div>

        <div class="love">
            I Loveee youhhh soo soo soo much Forever💋💋💋
        </div>

        <div class="message">
            You are very Important for My Whole life  ✨
        </div>

    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = ["💜", "💕", "💋", "😘", "🥹"][
                Math.floor(Math.random() * 5)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            heart.style.fontSize =
                (18 + Math.random() * 25) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 400);
    </script>

</body>
</html>
